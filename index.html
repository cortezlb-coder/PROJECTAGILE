<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00506d" />
    <title>Ka Lama | Campus Kiosk</title>
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" type="button" data-action="home" aria-label="Ka Lama kiosk home">
          <span class="brand-mark" aria-hidden="true">UH</span>
          <span class="brand-copy">
            <strong>UH Maui College</strong>
            <span>Ka Lama Building</span>
          </span>
        </button>
        <div class="topbar-right">
          <span class="open-label"><span class="status-dot"></span> CAMPUS KIOSK</span>
          <time id="clock" aria-label="Current time"></time>
        </div>
      </header>

      <main id="app" class="main-content" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="Kiosk sections">
        <button type="button" data-page="home" aria-current="page">
          <span class="nav-icon" aria-hidden="true">⌂</span><span>Home</span>
        </button>
        <button type="button" data-page="programs">
          <span class="nav-icon" aria-hidden="true">✦</span><span>Programs</span>
        </button>
        <button type="button" data-page="find">
          <span class="nav-icon" aria-hidden="true">⌖</span><span>Find</span>
        </button>
        <button type="button" data-page="jobs">
          <span class="nav-icon" aria-hidden="true">↗</span><span>Jobs</span>
        </button>
        <button type="button" data-page="more">
          <span class="nav-icon" aria-hidden="true">•••</span><span>More</span>
        </button>
      </nav>
      <div id="toast" class="toast" role="status" aria-live="assertive"></div>
    </div>
    <script src="app.js?v=3"></script>
  </body>
</html>
